services:
  - type: web
    name: roxy-trading
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 3000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ROXY_OUTPUT_DIR
        value: /var/data/output
      - key: ROXY_ALERTS_DIR
        value: /var/data/alerts
      - key: ROXY_DATA_DIR
        value: /var/data/data
      - key: ROXY_DB_DIR
        value: /var/data/db
      - key: ALPACA_PAPER
        value: "true"
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ROXY_STOCK_BRIDGE_URL
        value: https://roxy-stock-stream.onrender.com
      - key: ROXY_STOCK_STREAM_URL
        value: https://roxy-stock-stream.onrender.com/v1/market/stock-stream
      - key: ROXY_STOCK_SNAPSHOT_URL
        value: https://roxy-stock-stream.onrender.com/v1/market/stock-snapshot
      - key: ROXY_STOCK_ALPACA_STREAM
        value: "1"
      - key: ROXY_ENABLE_LIVE_BROKER_EXECUTION
        value: "0"
      - key: ROXY_ALPACA_PAPER_AUTOTRADE
        value: "false"
      - key: ROXY_AUTOPILOT_CODE_WRITE
        value: "0"
      - key: ROXY_PUBLIC_URL
        value: https://roxy-trading.onrender.com
      - key: ROXY_USERS_PATH
        value: /var/data/roxy_users.json
      - key: ROXY_GOOGLE_CLIENT_ID
        sync: false
      - key: ROXY_GOOGLE_CLIENT_SECRET
        sync: false
      - key: ROXY_APPLE_CLIENT_ID
        sync: false
      - key: ROXY_APPLE_TEAM_ID
        sync: false
      - key: ROXY_APPLE_KEY_ID
        sync: false
      - key: ROXY_APPLE_PRIVATE_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        value: agent_6101kwchebzdf91rfk9757wq0mk4
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ROXY_TRADING_OPENAI_ENABLED
        value: "1"
      - key: ROXY_TRADING_OPENAI_API_KEY
        sync: false
      - key: ROXY_TRADING_OPENAI_ROUTINE_MODEL
        value: gpt-5.6-luna
      - key: ROXY_TRADING_OPENAI_DEEP_MODEL
        value: gpt-5.6-terra
      - key: ROXY_TRADING_OPENAI_MONTHLY_BUDGET_USD
        value: "20"
      - key: ROXY_TRADING_OPENAI_MAX_CALL_USD
        value: "0.25"
      - key: ROXY_TRADING_OPENAI_USAGE_DB
        value: /var/data/alerts/roxy_trading_openai_usage.sqlite
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: ROXY_FINVIZ_EXPORT_URL
        sync: false
      - key: ROXY_FINVIZ_AUTH_TOKEN
        sync: false
      - key: CRYPTO_COM_API_KEY
        sync: false
      - key: CRYPTO_COM_API_SECRET
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PUSHOVER_APP_TOKEN
        sync: false
      - key: PUSHOVER_USER_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      name: roxy-runtime
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: roxy-home
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.roxy-home
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ROXY_HOME_API_KEY
        generateValue: true
      - key: ROXY_STATE_SYNC_USERS
        value: local_user
      - key: ROXY_SHOPPING_LIST_PATH
        value: /var/data/roxy_home/shopping_list.json
      - key: ROXY_HOME_MEMORY_PATH
        value: /var/data/roxy_home/home_food.json
      - key: ROXY_HOME_ACCOUNTS_PATH
        value: /var/data/roxy_home/accounts.json
      - key: ROXY_HOME_AI_BUDGET_PATH
        value: /var/data/roxy_home/openai_budget.json
      - key: ROXY_HOME_OPENAI_API_KEY
        sync: false
      - key: ROXY_HOME_OPENAI_ROUTINE_MODEL
        value: gpt-5.6-luna
      - key: ROXY_HOME_OPENAI_DEEP_MODEL
        value: gpt-5.6-terra
      - key: ROXY_HOME_AI_DAILY_REQUEST_LIMIT
        value: "100"
      - key: ROXY_HOME_AI_DAILY_OUTPUT_TOKEN_LIMIT
        value: "100000"
      - key: ROXY_HOME_AI_MAX_OUTPUT_TOKENS
        value: "4000"
    disk:
      name: roxy-home-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: roxy-stock-stream
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.stock-bridge
    dockerContext: .
    dockerCommand: ./scripts/stock_bridge_entrypoint.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: /app
      - key: ROXY_SERVICE_MODE
        value: stock-stream
      - key: ROXY_STOCK_BRIDGE_LOG_LEVEL
        value: info
      - key: ROXY_STOCK_BRIDGE_HOST
        value: 0.0.0.0
      - key: ROXY_STOCK_BRIDGE_TRUSTED_PROXIES
        value: 127.0.0.1
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ROXY_STOCK_ALPACA_STREAM
        value: "1"
      - key: ROXY_STOCK_STREAM_ALLOWED_ORIGINS
        value: https://roxy-trading.onrender.com
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false

  - type: web
    name: roxy-crypto
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.roxy-market
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ROXY_MARKET_PRODUCT
        value: crypto
      - key: ROXY_CRYPTO_ACCESS_KEY
        generateValue: true
      - key: ROXY_CRYPTO_OPENAI_ENABLED
        value: "1"
      - key: ROXY_CRYPTO_OPENAI_API_KEY
        sync: false
      - key: ROXY_CRYPTO_OPENAI_ROUTINE_MODEL
        value: gpt-5.6-luna
      - key: ROXY_CRYPTO_OPENAI_DEEP_MODEL
        value: gpt-5.6-terra
      - key: ROXY_CRYPTO_OPENAI_MONTHLY_BUDGET_USD
        value: "20"
      - key: ROXY_CRYPTO_OPENAI_MAX_CALL_USD
        value: "0.25"
      - key: ROXY_CRYPTO_OPENAI_USAGE_DB
        value: /var/data/alerts/roxy_crypto_openai_usage.sqlite
      - key: ROXY_TRADING_APP_URL
        value: https://roxy-trading.onrender.com
    disk:
      name: roxy-crypto-data
      mountPath: /var/data
      sizeGB: 1
